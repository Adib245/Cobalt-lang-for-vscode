<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
   <defs>
      <!-- Metallic Outer Frame Gradient -->
      <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
         <stop offset="0%" stop-color="#b0c4de" />
         <stop offset="35%" stop-color="#70889b" />
         <stop offset="70%" stop-color="#3a5266" />
         <stop offset="100%" stop-color="#1e2d3b" />
      </linearGradient>

      <!-- Metallic Highlight for Bevel Top -->
      <linearGradient id="metalHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
         <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
         <stop offset="50%" stop-color="#b0c4de" stop-opacity="0.2" />
         <stop offset="100%" stop-color="#101a24" stop-opacity="0.8" />
      </linearGradient>

      <!-- Pink/Copper Hexagon Gradient -->
      <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
         <stop offset="0%" stop-color="#f3b8c6" />
         <stop offset="50%" stop-color="#d9899e" />
         <stop offset="100%" stop-color="#aa556d" />
      </linearGradient>

      <!-- Cyan Inner Glow Filter -->
      <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
         <feGaussianBlur stdDeviation="5" result="blur" />
         <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
   </defs>

   <!-- Outer Dark Frame Shadow / Base -->
   <polygon points="250,10 470,137 470,393 250,520 30,393 30,137" fill="#141e28" />

   <!-- Outer Metallic Beveled Frame -->
   <polygon points="250,15 460,140 460,390 250,515 40,390 40,140" fill="url(#metalGrad)"
      stroke="url(#metalHighlight)" stroke-width="4" />

   <!-- Outer Hexagon Metallic Rim Inner Edge Cutout -->
   <polygon points="250,55 420,155 420,375 250,475 80,375 80,155" fill="#0d151d" />

   <!-- Cyan Neon Glow Line -->
   <polygon points="250,65 410,160 410,370 250,465 90,370 90,160" fill="none" stroke="#00e5ff"
      stroke-width="5" filter="url(#cyanGlow)" opacity="0.9" />

   <!-- Inner Background Hexagon (#1f272f) behind the "C" -->
   <polygon points="250,72 402,163 402,367 250,458 98,367 98,163" fill="#1f272f" />

   <!-- Main Pink/Copper "C" Hexagonal Logo -->
   <path
   d="
   M 250,115
   L 375,187
   L 330,213
   L 250,167
   L 170,213
   L 170,307
   L 250,353
   L 330,307
   L 375,333
   L 250,405
   L 125,333
   L 125,187
   Z"
   fill="url(#pinkGrad)"
   stroke="#8c3f54"
   stroke-width="2"
   stroke-linejoin="round" />

<!-- "C" Inner Highlight Overlay -->
<path
   d="
   M 250,115
   L 375,187
   L 330,213
   L 250,167
   L 170,213
   L 170,307
   L 250,353
   L 330,307
   L 375,333
   L 250,405
   L 125,333
   L 125,187
   Z"
   fill="none"
   stroke="#ffffff"
   stroke-width="1.5"
   opacity="0.4" />
</svg>